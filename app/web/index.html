<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Título e descrição da página de apresentação (a chamada principal), lidos por
         buscadores e pelas prévias de link. Dentro do app, o título vira "Ascent Legendas". -->
    <title>Ascent Legendas: legenda dinâmica pronta em 1 minuto</title>
    <meta name="description" content="Legenda dinâmica pronta em 1 minuto, direto do celular. Envie o vídeo. O app transcreve, sincroniza com a sua fala e anima cada palavra. Você só baixa e posta." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ascent Legendas" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://legendas.ascentstudio.com.br/" />
    <meta property="og:title" content="Legenda dinâmica pronta em 1 minuto, direto do celular." />
    <meta property="og:description" content="Envie o vídeo. O app transcreve, sincroniza com a sua fala e anima cada palavra. Você só baixa e posta." />
    <meta property="og:image" content="https://legendas.ascentstudio.com.br/icones/icone-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- App instalado (PWA): manifesto, ícones e cor da barra do sistema. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#030210" />
    <link rel="icon" href="/icones/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icones/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icones/favicon-48.png" />
    <!-- iPhone: abre sem a barra do Safari, a barra de status por cima do app (a tela
         respeita a área segura com env(safe-area-inset-*)) e o ícone da Tela de Início. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Legendas" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icones/apple-touch-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
