<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layouts de legenda, pacote B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;600;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  --pagina:#16161a; --texto:#f2f0ec; --suave:#9a968f;
  --sans:'Inter Tight',Helvetica,Arial,sans-serif;
  --didone:'Playfair Display',Georgia,serif;
  --sombra:0 .5cqw 3cqw rgba(0,0,0,.55);
  /* paleta branco */
  --chave:linear-gradient(180deg,#ffffff,#ffffff);
  --g1:rgba(255,255,255,.5); --g2:rgba(255,255,255,.25);
}
body.vermelho{--chave:linear-gradient(180deg,#ff3b2f 0%,#c40d0d 100%);--g1:rgba(255,40,30,.75);--g2:rgba(255,0,0,.45)}
body.amarelo{--chave:linear-gradient(180deg,#fff2a8 0%,#ffc21a 55%,#ff9d00 100%);--g1:rgba(255,190,40,.6);--g2:rgba(255,150,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--pagina);color:var(--texto);font-family:var(--sans);padding:32px 20px 56px}
header{max-width:1100px;margin:0 auto 28px;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
h1{font:800 28px/1 var(--sans);letter-spacing:-.03em;margin:0 0 8px}
header p{margin:0;color:var(--suave);font-size:15px;max-width:56ch;line-height:1.5}
.botoes{display:flex;flex-wrap:wrap;gap:8px}
button{font:600 14px var(--sans);color:var(--texto);background:transparent;border:1px solid #4a4a54;border-radius:8px;padding:10px 14px;cursor:pointer}
button:hover{background:#24242b}
button[aria-pressed="true"]{background:#f2f0ec;color:#16161a;border-color:#f2f0ec}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px 20px}
figure{margin:0}
.q{position:relative;aspect-ratio:9/16;container-type:inline-size;overflow:hidden;border-radius:10px;background:#1b1a19}
body.cena .q{background:linear-gradient(180deg,#d8cdbf 0%,#cbbba8 30%,#6a4a35 44%,#553a29 66%,#e6e2dc 76%,#d9d4cc 100%)}
body.claro .q{background:#efece6}
.b{position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);width:max-content;max-width:90cqw;
  color:#fff;text-align:center;text-shadow:var(--sombra);white-space:nowrap}
.esq{text-align:left}
.rot{font:600 4.6cqw/1 var(--sans);letter-spacing:-.01em;position:relative;z-index:1}
.leve{font-weight:300}
.forte{font-weight:800;letter-spacing:-.04em}
.pesada{font-family:var(--sans);font-weight:800;letter-spacing:-.045em;line-height:.88}
.didone{font-family:var(--didone);font-style:italic;font-weight:500;letter-spacing:-.03em;line-height:.9}
/* palavra-chave: preenchimento da paleta + brilho no elemento de fora */
.kw{display:block;filter:drop-shadow(0 0 1.4cqw var(--g1)) drop-shadow(0 0 5cqw var(--g2)) drop-shadow(0 .5cqw 2cqw rgba(0,0,0,.4))}
.tx{display:inline-block;padding:.06em .14em;margin:-.06em -.14em;text-shadow:none;
  background:var(--chave);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.w{display:inline-block;animation:sobe .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.w.foco{animation-name:foco;animation-duration:.55s}
@keyframes sobe{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}
@keyframes foco{from{opacity:0;filter:blur(.12em);transform:scale(.94)}to{opacity:1;filter:none;transform:none}}
@media (prefers-reduced-motion:reduce){.w{animation:none}}

.dois{display:flex;justify-content:space-between;padding:0 .3em}
/* B1 */
.b1 .rot{margin:0 0 -.5em .5em}
.b1 .rod{text-align:right;font:300 7cqw/1 var(--sans);margin-top:-.35em;position:relative}
/* B2 */
.b2 .dois{margin-bottom:.1em}
.b2 .baixo{font-size:13cqw;margin-top:-.4em;position:relative}
/* B3 */
.b3 .l1{font-size:6cqw}
.b3 .l2{font-size:12cqw;margin-top:-.04em}
.b3 .kw{margin-top:-.03em}
/* B4 */
.b4 .dois{margin-bottom:-.6em}
/* B5 */
.b5 .l1{font-size:8cqw}
.b5 .l2{font-size:12cqw}
.b5 .kw{margin-top:-.14em}
/* B6 */
.b6 .topo{font:300 5cqw/1 var(--sans);margin-bottom:-.5em;position:relative;z-index:1}
.b6 .topo .forte{font-size:8cqw}
.b6 .selo{text-align:right;font:800 5cqw/1 var(--sans);letter-spacing:-.03em;margin-top:-.3em;padding-right:.4em;position:relative}

figcaption{padding:12px 2px 0}
figcaption b{display:block;font:800 16px/1.2 var(--sans);letter-spacing:-.02em;margin-bottom:6px}
figcaption span{display:block;color:var(--suave);font-size:13.5px;line-height:1.5}
</style>
</head>
<body class="vermelho">
<header>
  <div>
    <h1>Pacote B</h1>
    <p>Seis composições com serifada de alto contraste e sans pesada, em três paletas. A paleta pinta só a palavra-chave e o brilho.</p>
  </div>
  <div class="botoes">
    <button data-paleta="branco" aria-pressed="false">Branco</button>
    <button data-paleta="vermelho" aria-pressed="true">Vermelho</button>
    <button data-paleta="amarelo" aria-pressed="false">Amarelo</button>
    <button id="fundo">Trocar fundo</button>
    <button id="repetir">Repetir animação</button>
  </div>
</header>

<main>
  <figure>
    <div class="q"><div class="b esq b1">
      <div class="rot"><span class="w">contar</span> <span class="w" style="--d:.1s">com</span></div>
      <span class="kw"><span class="tx didone w foco" data-w="80" data-max="26" style="--d:.24s">depilação</span></span>
      <div class="rod"><span class="w" style="--d:.42s">a</span> <span class="w forte" style="--d:.5s">laser</span></div>
    </div></div>
    <figcaption><b>B1. Rótulo, serifa e rodapé</b><span>Rótulo sans 600 de 4,6% entrando no topo da palavra-chave. Palavra-chave serifada itálica com 80% da largura. Rodapé à direita, 7%, palavra fina seguida de palavra pesada.</span></figcaption>
  </figure>

  <figure>
    <div class="q"><div class="b b2">
      <div class="rot dois"><span class="w">estaremos</span><span class="w" style="--d:.1s">com</span></div>
      <span class="kw"><span class="tx pesada w foco" data-w="78" data-max="28" style="--d:.22s">preços</span></span>
      <div class="didone baixo"><span class="w" style="--d:.44s">imperdíveis</span></div>
    </div></div>
    <figcaption><b>B2. Pesada com dois rótulos</b><span>Dois rótulos nas pontas de cima. Palavra-chave sans 800 com 78% da largura. Serifada itálica branca de 13% embaixo, subindo 40% sobre a palavra-chave.</span></figcaption>
  </figure>

  <figure>
    <div class="q"><div class="b b3">
      <div class="pesada l1"><span class="w">clique</span></div>
      <div class="pesada l2"><span class="w" style="--d:.12s">no link</span></div>
      <span class="kw"><span class="tx pesada w foco" data-w="62" data-max="30" style="--d:.28s">da bio</span></span>
    </div></div>
    <figcaption><b>B3. Pilha crescente</b><span>Três linhas sans 800 centralizadas, crescendo: 6%, 12% e a última ajustada para 62% da largura. Entrelinha 0,88.</span></figcaption>
  </figure>

  <figure>
    <div class="q"><div class="b b4">
      <div class="rot dois"><span class="w">lidar</span><span class="w" style="--d:.1s">com</span></div>
      <span class="kw"><span class="tx didone w foco" data-w="84" data-max="30" style="--d:.22s">irritações</span></span>
    </div></div>
    <figcaption><b>B4. Serifa gigante</b><span>Palavra-chave serifada itálica com 84% da largura. Dois rótulos pequenos nas pontas, sobrepostos ao topo dela.</span></figcaption>
  </figure>

  <figure>
    <div class="q"><div class="b esq b5">
      <div class="pesada l1"><span class="w">faz a</span></div>
      <div class="pesada l2"><span class="w" style="--d:.12s">diminuição</span></div>
      <span class="kw"><span class="tx didone w foco" data-w="70" data-max="26" style="--d:.3s">gradual</span></span>
    </div></div>
    <figcaption><b>B5. Esquerda mista</b><span>Alinhado à esquerda: duas linhas sans 800 (8% e 12%) e a palavra-chave serifada itálica com 70% da largura, subindo 14%.</span></figcaption>
  </figure>

  <figure>
    <div class="q"><div class="b b6">
      <div class="topo"><span class="w">assim</span> <span class="w forte" style="--d:.1s">uma</span></div>
      <span class="kw"><span class="tx didone w foco" data-w="82" data-max="28" style="--d:.24s">praticidade</span></span>
      <div class="selo"><span class="w" style="--d:.46s">e conforto</span></div>
    </div></div>
    <figcaption><b>B6. Serifa com selo</b><span>Topo com palavra fina de 5% e palavra pesada de 8%. Palavra-chave serifada itálica com 82% da largura. Selo sans 800 de 5% embaixo à direita.</span></figcaption>
  </figure>
</main>

<script>
function ajustar(){
  document.querySelectorAll('[data-w]').forEach(function(el){
    var W=el.closest('.q').clientWidth;
    el.style.fontSize='100px';
    var larg=el.offsetWidth||1;
    var alvo=100*(parseFloat(el.dataset.w)/100*W)/larg;
    var teto=parseFloat(el.dataset.max)/100*W;
    el.style.fontSize=Math.min(alvo,teto).toFixed(1)+'px';
  });
}
function repetir(){
  document.querySelectorAll('.w').forEach(function(el){
    el.style.animation='none';void el.offsetWidth;el.style.animation='';
  });
}
var paleta='vermelho',fundos=['','cena','claro'],fundo=0;
function aplicar(){document.body.className=(paleta+' '+fundos[fundo]).trim();}
document.querySelectorAll('[data-paleta]').forEach(function(bt){
  bt.addEventListener('click',function(){
    paleta=bt.dataset.paleta;aplicar();
    document.querySelectorAll('[data-paleta]').forEach(function(o){o.setAttribute('aria-pressed',o===bt?'true':'false');});
  });
});
document.getElementById('fundo').addEventListener('click',function(){fundo=(fundo+1)%fundos.length;aplicar();});
document.getElementById('repetir').addEventListener('click',repetir);
ajustar();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(ajustar);}
window.addEventListener('resize',ajustar);
</script>
</body>
</html>
